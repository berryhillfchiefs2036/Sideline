<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sideline — game day tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Track little league football plays, subs, and play counts from the sideline.">
<meta name="theme-color" content="#DDE3D2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sideline">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; }
body { overscroll-behavior-y: contain; }

.sl {
  --turf:#DDE3D2; --turf2:#D2DAC6; --card:#FBFAF4; --ink:#17251E; --soft:#61705F;
  --line:#C3CDB6; --go:#1D6F5C; --stop:#B2402F; --lamp:#D98E22; --plate:#2A3A2E;
  --cond:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',sans-serif;
  font-family: var(--body); color: var(--ink); background: var(--turf);
  min-height:100vh; padding-bottom:86px; position:relative;
}
.sl::before{ content:''; position:fixed; inset:0; pointer-events:none; opacity:.5;
  background:repeating-linear-gradient(90deg, transparent 0 63px, rgba(23,37,30,.055) 63px 64px); }
.sl-in { position:relative; max-width:760px; margin:0 auto; padding:0 12px; }

.eyebrow { font-family:var(--cond); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); }

.crew { display:flex; align-items:center; gap:8px; padding:7px 10px; margin-top:10px;
  background:var(--card); border:1px solid var(--line); border-radius:10px; cursor:pointer; width:100%; text-align:left; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--soft); flex:0 0 auto; }
.dot.live { background:var(--go); animation:pulse 2.4s infinite; }
.dot.err { background:var(--lamp); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
@media (prefers-reduced-motion:reduce){ .dot.live{animation:none} }

.board { background:var(--plate); border-radius:14px; margin-top:10px; padding:10px 12px 12px;
  box-shadow:0 2px 0 rgba(23,37,30,.25); }
.board-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.score-blk { text-align:center; min-width:74px; }
.score-blk .eyebrow { color:#8FA394; }
.score-num { font-family:var(--cond); font-weight:700; font-size:38px; line-height:.95; color:#F3F1E6; }
.score-btns { display:flex; gap:5px; justify-content:center; margin-top:4px; }
.tick { width:26px; height:22px; border-radius:6px; border:1px solid #4A5C4E; background:#334437;
  color:#CFDAC9; font-family:var(--cond); font-size:14px; font-weight:600; cursor:pointer; }
.tick:active { background:#465A49; }
.dd { text-align:center; flex:1; }
.dd-main { font-family:var(--cond); font-weight:700; font-size:40px; line-height:1; color:var(--lamp); }
.dd-main small { color:#F3F1E6; font-size:26px; font-weight:500; }
.dd-sub { font-family:var(--cond); font-size:12px; letter-spacing:.16em; color:#8FA394; text-transform:uppercase; margin-top:2px; }
.board-btm { display:flex; gap:6px; margin-top:10px; }
.chip { flex:1; padding:7px 4px; border-radius:8px; border:1px solid #4A5C4E; background:transparent;
  color:#B9C7B6; font-family:var(--cond); font-size:14px; font-weight:600; letter-spacing:.05em; cursor:pointer; }
.chip.on { background:var(--lamp); border-color:var(--lamp); color:#241A05; }
.dist-sel { flex:2; padding:7px 8px; border-radius:8px; border:1px solid #4A5C4E; background:#334437;
  color:#CFDAC9; font-family:var(--cond); font-size:14px; font-weight:600; letter-spacing:.05em; cursor:pointer; }

.units { display:flex; gap:8px; margin:14px 0 10px; }
.unit { flex:1; padding:11px 4px 9px; border-radius:11px; background:var(--card); border:1px solid var(--line);
  border-bottom-width:3px; font-family:var(--cond); font-size:17px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--soft); cursor:pointer; }
.unit.on { color:var(--card); }
.unit.on.offense { background:var(--go); border-color:#12503D; }
.unit.on.defense { background:var(--plate); border-color:#101A14; }
.unit.on.special { background:var(--lamp); border-color:#A96A12; color:#241A05; }

.stbar { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:10px; }
.stbar button { flex:0 0 auto; padding:6px 12px; border-radius:20px; border:1px solid var(--line);
  background:var(--card); font-family:var(--cond); font-size:14px; letter-spacing:.04em; color:var(--soft); cursor:pointer; }
.stbar button.on { background:var(--plate); color:#F3F1E6; border-color:var(--plate); }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
@media (min-width:600px){ .grid { grid-template-columns:1fr 1fr 1fr; } }
.pcard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 9px 7px;
  text-align:left; display:flex; flex-direction:column; gap:5px; transition:transform .07s; }
.pcard:active { transform:scale(.975); }
.pcard.empty { background:transparent; border-style:dashed; }
.pcard.moving { border-color:var(--lamp); border-width:2px; background:#FBF3E3; }
.pcard.target { border-color:var(--lamp); border-style:solid; }
.pc-top { display:flex; align-items:center; gap:8px; cursor:pointer; }
.pc-top:focus-visible { outline:3px solid var(--lamp); outline-offset:3px; border-radius:8px; }
.plate { flex:0 0 auto; min-width:38px; height:34px; border-radius:7px; background:var(--plate); color:#F3F1E6;
  font-family:var(--cond); font-weight:700; font-size:21px; display:flex; align-items:center; justify-content:center; padding:0 5px; }
.pcard.empty .plate { background:transparent; border:1px dashed var(--line); color:var(--soft); font-size:15px; }
.pc-name { font-size:14px; font-weight:600; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pc-slot { font-family:var(--cond); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--soft); }
.pc-btm { display:flex; align-items:center; justify-content:space-between; gap:6px; }

.chain { display:flex; gap:2px; align-items:flex-end; height:11px; }
.chain i { width:4px; height:8px; border-radius:1px; background:var(--line); display:block; }
.chain i.f { background:var(--go); height:11px; }
.chain i.o { background:var(--stop); height:11px; }
.chain.short i { background:#E3C9C3; }
.sub-btn { flex:0 0 auto; border:1px solid var(--line); background:var(--turf2); border-radius:7px;
  padding:3px 7px; font-family:var(--cond); font-size:12px; letter-spacing:.06em; color:var(--soft); cursor:pointer; }
.sub-btn.ready { border-color:var(--go); color:var(--go); background:#E4EEE6; }

.actionbar { display:flex; gap:8px; margin-top:12px; }
.abtn { flex:1; padding:13px 6px; border-radius:11px; border:1px solid var(--line); background:var(--card);
  font-family:var(--cond); font-size:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink); cursor:pointer; }
.abtn.ghost { color:var(--soft); }
.abtn:disabled { opacity:.4; cursor:default; }
.banner { background:#FBF3E3; border:1px solid var(--lamp); border-radius:11px; padding:10px 12px;
  margin-top:10px; font-size:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.veil { position:fixed; inset:0; background:rgba(23,37,30,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--turf); width:100%; max-width:760px; border-radius:18px 18px 0 0; padding:14px 14px 26px;
  max-height:92vh; overflow-y:auto; animation:rise .18s ease-out; }
@keyframes rise { from { transform:translateY(24px); opacity:.4 } to { transform:none; opacity:1 } }
@media (prefers-reduced-motion:reduce){ .sheet{animation:none} }
.sheet-hd { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.sheet-hd .plate { min-width:46px; height:42px; font-size:26px; }
.sheet-ttl { font-size:17px; font-weight:700; line-height:1.1; }
.close { margin-left:auto; border:none; background:transparent; font-family:var(--cond); font-size:15px;
  letter-spacing:.1em; color:var(--soft); cursor:pointer; text-transform:uppercase; }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.opt { padding:11px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); text-align:left; cursor:pointer; }
.opt.on { background:var(--plate); border-color:var(--plate); }
.opt.on .opt-l { color:#F3F1E6; } .opt.on .opt-h { color:#93A594; }
.opt-l { font-family:var(--cond); font-size:16px; font-weight:600; letter-spacing:.04em; }
.opt-h { font-size:11px; color:var(--soft); margin-top:1px; }
.yardbox { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:10px; }
.yardnum { font-family:var(--cond); font-weight:700; font-size:52px; line-height:1; text-align:center; }
.yardnum.gain { color:var(--go); } .yardnum.loss { color:var(--stop); } .yardnum.zero { color:var(--soft); }
.yardrow { display:flex; gap:6px; margin-top:8px; }
.yardrow button { flex:1; padding:11px 2px; border-radius:9px; border:1px solid var(--line); background:var(--turf2);
  font-family:var(--cond); font-size:16px; font-weight:600; cursor:pointer; }
.bigcode { font-family:var(--cond); font-size:40px; font-weight:700; letter-spacing:.18em; line-height:1.15; }
.confirm { width:100%; margin-top:12px; padding:16px; border-radius:12px; border:none; background:var(--go);
  color:#F3F1E6; font-family:var(--cond); font-size:20px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
.confirm.alt { background:var(--lamp); color:#241A05; }
.confirm:disabled { background:#A8B4A5; cursor:default; }

.nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
  display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom); }
.nav button { flex:1; padding:11px 0 12px; border:none; background:transparent; font-family:var(--cond);
  font-size:14px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); cursor:pointer;
  border-top:3px solid transparent; margin-top:-1px; }
.nav button.on { color:var(--ink); border-top-color:var(--lamp); }

.row { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:9px 10px; margin-bottom:7px;
  display:flex; align-items:center; gap:10px; }
.inp { border:1px solid var(--line); border-radius:9px; padding:10px; font-size:16px; background:var(--card);
  color:var(--ink); font-family:var(--body); width:100%; }
.inp:focus { outline:2px solid var(--lamp); outline-offset:1px; }
.code-inp { font-family:var(--cond); font-size:26px; font-weight:700; letter-spacing:.22em; text-align:center; text-transform:uppercase; }
.slot-inp { flex:0 0 92px; width:92px; font-family:var(--cond); font-weight:600; font-size:14px;
  letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:9px 4px;
  background:var(--plate); color:#F3F1E6; border-color:var(--plate); border-radius:7px; }
.mini { border:1px solid var(--line); background:var(--turf2); border-radius:8px; padding:6px 10px;
  font-family:var(--cond); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); cursor:pointer; }
.mini.dark { background:var(--plate); color:#F3F1E6; border-color:var(--plate); }
.fold { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:10px; margin-bottom:7px; }
.fold summary { font-family:var(--cond); font-size:14px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--soft); cursor:pointer; }
.fold textarea { margin-top:10px; font-family:var(--body); }
.sechd { display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 8px; }
.h2 { font-family:var(--cond); font-size:22px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
.empty-note { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:22px 16px;
  text-align:center; color:var(--soft); font-size:14px; line-height:1.5; }
table { width:100%; border-collapse:collapse; background:var(--card); border-radius:11px; overflow:hidden;
  border:1px solid var(--line); font-size:13px; }
th { font-family:var(--cond); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft);
  text-align:right; padding:7px 5px; background:var(--turf2); }
th:first-child, td:first-child { text-align:left; padding-left:9px; }
td { padding:8px 5px; text-align:right; border-top:1px solid var(--line); }
td.n { font-family:var(--cond); font-size:15px; font-weight:600; }
tr.short td { background:#F7EAE6; }
.logline { display:flex; gap:9px; align-items:baseline; padding:8px 2px; border-bottom:1px solid var(--line); font-size:13px; }
.logline .eyebrow { flex:0 0 58px; }
.who { font-family:var(--cond); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); margin-left:auto; flex:0 0 auto; }
.boot { padding:60px 20px; text-align:center; font-family:'Saira Condensed',sans-serif; letter-spacing:.2em;
  text-transform:uppercase; color:#61705F; background:#DDE3D2; min-height:100vh; }
/* Gamecast field graphic */
.gc-meta { display:flex; gap:8px; margin-top:10px; }
.gc-meta > div { flex:1; text-align:center; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:7px 4px 6px; }
.gc-meta b { display:block; font-family:var(--cond); font-size:19px; font-weight:700; margin-top:1px; }
.gc-field { display:flex; height:74px; margin-top:10px; border-radius:10px; overflow:hidden;
  border:1px solid #4E6A4A; }
.gc-ez { flex:0 0 11%; background:var(--go); }
.gc-ez.opp { background:var(--plate); }
/* Alternating 5-yard stripes, mowed light and dark. */
.gc-turf { flex:1; position:relative;
  background:repeating-linear-gradient(90deg,#6A9B60 0 5%,#5C8A54 5% 10%); }
.gc-tick { position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.35); }
.gc-tick.mid { width:2px; background:rgba(255,255,255,.6); }
.gc-num { position:absolute; bottom:2px; transform:translateX(-50%); font-family:var(--cond);
  font-size:10px; font-weight:600; letter-spacing:.04em; color:rgba(255,255,255,.8); }
.gc-togo { position:absolute; top:0; bottom:0; width:2px; background:var(--lamp); }
.gc-ball { position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
  background:#F3F1E6; border:3px solid #7A4A1E; box-shadow:0 1px 4px rgba(0,0,0,.45); }
.gc-scale { display:flex; justify-content:space-between; margin-top:4px; padding:0 2px;
  font-family:var(--cond); font-size:12px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--soft); }
</style>
</head>
<body>
<div id="root"><div class="boot">Sideline</div></div>

<script src="./config.js"></script>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/supabase.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
